; Trakr - Firmware da Maleta (ESP32, fonte da verdade)
; O Cérebro da Maleta: leitor RFID (YRM100), BLE e máquina de estados.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Upload dos arquivos (inventory.json) para o LittleFS
board_build.filesystem = littlefs
upload_filesystem = pio run --target uploadfs

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Iinclude/
  ; Descomente para testar SEM o YRM100 (gera leituras simuladas):
  ; -DTRAKR_SIM

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  h2zero/NimBLE-Arduino@^2.2.0

; Ambiente alternativo: gera leituras simuladas (testar fluxo sem o YRM100)
[env:esp32dev-sim]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DTRAKR_SIM