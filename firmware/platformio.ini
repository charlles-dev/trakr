; TRK-Finder - Firmware ESP32 (Rastreador Portátil, fonte da verdade)
; Leitor RFID (YRM100), BLE, modo radar com RSSI e deep sleep.

[env:esp32radar]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Upload dos arquivos (inventory.json) para o LittleFS
board_build.filesystem = littlefs
upload_filesystem = pio run --target uploadfs

; OTA: tabela com otadata + app0/app1 (rollback automático se o FW travar)
board_build.flash_size = 4MB
board_build.partitions = partitions/ota_4mb.csv

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Iinclude/
  -DTRAKR_GIT_COMMIT=\"${sysenv.GIT_COMMIT}\"
  ; Descomente para testar SEM o YRM100 (gera leituras simuladas):
  ; -DTRAKR_SIM

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  h2zero/NimBLE-Arduino@^2.2.0
  fastled/FastLED@^3.6.0
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit INA219@^1.2.0
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/Adafruit Unified Sensor@^1.1.14
  ElectronicCats/MPU6050@^0.5.0

; Radar com leituras simuladas (testar app sem o YRM100)
[env:esp32radar-sim]
extends = env:esp32radar
build_flags =
  ${env:esp32radar.build_flags}
  -DTRAKR_SIM

; --- ESP32-S3 (USB OTG, USB-C nativo) ---
[env:esp32s3radar]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.flash_size = 8MB
board_build.partitions = partitions/ota_8mb.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Iinclude/
  -DTRAKR_GIT_COMMIT=\"${sysenv.GIT_COMMIT}\"
lib_deps =
  ${env:esp32radar.lib_deps}

[env:esp32s3radar-sim]
extends = env:esp32s3radar
build_flags =
  ${env:esp32s3radar.build_flags}
  -DTRAKR_SIM