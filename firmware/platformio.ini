; Trakr - Firmware da Maleta (ESP32, fonte da verdade)
; O Cérebro da Maleta: leitor RFID/NFC (YRM100), BLE e máquina de estados.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Upload dos arquivos (inventory_template.json) para o LittleFS
board_build.filesystem = littlefs
upload_filesystem = pio run --target uploadfs

build_flags =
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  h2zero/NimBLE-Arduino@^2.2.0